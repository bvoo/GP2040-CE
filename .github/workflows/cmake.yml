name: CMake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  #  pull_request_target:
  #    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      board_config:
        description: "Board configuration to build (leave empty to build all)"
        required: false
        type: choice
        options:
          - ""
          - ARCController
          - ASiLVLABC
          - ASiLVLWASD
          - Blank
          - Pico
          - PicoW
          - Pico2
          - BentoBox
          - DuelPadZen
          - FlatboxRev4
          - FlatboxRev5
          - FlatboxRev5RGB
          - FlatboxRev5USBPassthrough
          - FlatboxRev5Southpaw
          - FlatboxRev8
          - Granola
          - GranolaBeacon
          - KB2040
          - KeyboardConverter
          - Haute42COSMOX
          - Haute42COSMOXMLite
          - Haute42COSMOXMUltra
          - Haute42COSMOXXAnalog
          - Liatris
          - MavercadeRev1
          - MavercadeRev2
          - MavercadeRev3
          - MiSTercadeV2
          - OpenCore0
          - OpenCore0MIXUP
          - OpenCore0WASD
          - OSUMGP-RP2040
          - PicoAnn
          - PicoFightingBoard
          - PXPGamepad
          - ReflexCtrlGenesis6
          - ReflexCtrlNES
          - ReflexCtrlSaturn
          - ReflexCtrlSNES
          - ReflexCtrlVB
          - ReflexEncodeV1.2
          - ReflexEncodeV2.0
          - RP2040AdvancedBreakoutBoard
          - RP2040AdvancedBreakoutBoardUSBPassthrough
          - RP2040MiniBreakoutBoard
          - RP2040MiniBreakoutBoardUSBPassthrough
          - SeeedXIAORP2040
          - SparkFunProMicro
          - SparkFunProMicroRP2350
          - WaveshareZero
          - Stress
          - SGFDevices
          - ZeroRhythm
          - GramSlimFGC

env:
  BUILD_TYPE: Release

jobs:
  call-node-workflow:
    uses: ./.github/workflows/node.js.yml
  build:
    needs: call-node-workflow
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        GP2040_BOARDCONFIG:
          [GramSlimFGC]
    steps:
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.17.x"
      - name: Verify cmake
        run: cmake --version

      #Global Setup
      - name: Checkout GP2040-CE
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup SDK pipeline
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Clean upstream tags
        run: |
          git tag -l "upstream-*" | xargs -r git tag -d

      - name: Download a Build Artifact
        uses: actions/download-artifact@v4.1.2
        with:
          name: fsData
          path: ${{github.workspace}}/lib/httpd/

      - name: Get core count
        id: core_count
        run: cat /proc/cpuinfo  | grep processor | wc -l
        #End Global Setup

      - name: Pico Build Configure CMake
        shell: bash
        if: ${{ matrix.GP2040_BOARDCONFIG != 'PicoW' && matrix.GP2040_BOARDCONFIG != 'Pico2' && matrix.GP2040_BOARDCONFIG != 'SparkFunProMicroRP2350' && matrix.GP2040_BOARDCONFIG != 'FlatboxRev8' }}
        run: PICO_SDK_PATH=${{github.workspace}}/pico-sdk GP2040_BOARDCONFIG=${{ matrix.GP2040_BOARDCONFIG }} SKIP_WEBBUILD=TRUE cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: PicoW Build Configure CMake
        shell: bash
        if: ${{ matrix.GP2040_BOARDCONFIG == 'PicoW'}}
        run: PICO_SDK_PATH=${{github.workspace}}/pico-sdk GP2040_BOARDCONFIG=${{ matrix.GP2040_BOARDCONFIG }} SKIP_WEBBUILD=TRUE cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DPICO_BOARD=pico_w

      - name: Pico2 Build Configure CMake
        shell: bash
        if: ${{ matrix.GP2040_BOARDCONFIG == 'Pico2' || matrix.GP2040_BOARDCONFIG == 'SparkFunProMicroRP2350' || matrix.GP2040_BOARDCONFIG == 'FlatboxRev8' }}
        run: PICO_SDK_PATH=${{github.workspace}}/pico-sdk GP2040_BOARDCONFIG=${{ matrix.GP2040_BOARDCONFIG }} SKIP_WEBBUILD=TRUE cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350-arm-s

      - name: Pico Build
        shell: bash
        run: GP2040_BOARDCONFIG=${{ matrix.GP2040_BOARDCONFIG }} cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel ${{steps.core_count.outputs.output}}

      - name: Upload Pico Artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: GP2040-CE - ${{ matrix.GP2040_BOARDCONFIG }}
          path: ${{github.workspace}}/build/GP2040-CE_*_${{ matrix.GP2040_BOARDCONFIG }}.uf2
          if-no-files-found: error

      - name: Upload .elf Artifact
        if: ${{ matrix.GP2040_BOARDCONFIG == 'Pico'}}
        uses: actions/upload-artifact@v4.3.1
        with:
          name: elf
          path: ${{github.workspace}}/build/GP2040-CE_*_${{ matrix.GP2040_BOARDCONFIG }}.elf
          if-no-files-found: error

      # Extract version information
      - name: Extract version information
        id: version
        run: |
          # Get Git version info (only match version tags like v0.7.9)
          GIT_VERSION=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || git rev-parse --short=7 HEAD)
          echo "git_version=$GIT_VERSION" >> $GITHUB_OUTPUT
          echo "Found git version: $GIT_VERSION"

          # Get the actual UF2 filename
          UF2_FILE=$(ls ${{github.workspace}}/build/GP2040-CE_*_${{ matrix.GP2040_BOARDCONFIG }}.uf2)
          echo "uf2_file=$UF2_FILE" >> $GITHUB_OUTPUT
          echo "UF2 file: $UF2_FILE"

          # Fetch upstream tag info from GitHub API
          RESPONSE=$(curl -s https://api.github.com/repos/OpenStickCommunity/GP2040-CE/tags)
          UPSTREAM_TAG=$(echo "$RESPONSE" | jq -r '.[0].name')
          UPSTREAM_COMMIT=$(echo "$RESPONSE" | jq -r '.[0].commit.sha')
          UPSTREAM_VERSION=$(echo "$UPSTREAM_TAG" | sed 's/^v//')

          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "upstream_commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          echo "upstream_version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          echo "Using upstream tag: $UPSTREAM_TAG, commit: $UPSTREAM_COMMIT, version: $UPSTREAM_VERSION"

          # Create a new filename with version information
          BASE_NAME=$(basename "$UF2_FILE")
          # Extract the base part of the filename without version
          BASE_PREFIX="GP2040-CE"

          # Use upstream version number and local commit hash
          NEW_NAME="${BASE_PREFIX}_${UPSTREAM_VERSION}_${{ matrix.GP2040_BOARDCONFIG }}_${GIT_VERSION}.uf2"

          cp "$UF2_FILE" "${{github.workspace}}/build/$NEW_NAME"
          echo "versioned_uf2_file=${{github.workspace}}/build/$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Created versioned UF2: $NEW_NAME"

      # Create a GitHub release
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: GP2040-CE ${{ steps.version.outputs.upstream_version }} - ${{ matrix.GP2040_BOARDCONFIG }}
          tag_name: ${{ steps.version.outputs.upstream_tag }}
          files: ${{ steps.version.outputs.versioned_uf2_file }}
          body: |
            Merge from OpenStickCommunity/GP2040-CE ${{ steps.version.outputs.upstream_tag }} (commit ${{ steps.version.outputs.upstream_commit }})
            Board: ${{ matrix.GP2040_BOARDCONFIG }}
            Git version: ${{ steps.version.outputs.git_version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
